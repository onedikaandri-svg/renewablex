name: Calculation Engine CI

on:
  push:
    paths:
      - "services/calculation-engine/**"
      - "examples/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "services/calculation-engine/**"
      - "examples/**"
      - ".github/workflows/ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/calculation-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest
